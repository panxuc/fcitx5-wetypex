name: fcitx5-wetypex
arch: amd64
platform: linux
version: "@WETYPEX_VERSION@"
release: "8"
section: utils
priority: optional
maintainer: WeTypeX contributors <https://github.com/panxuc/fcitx5-wetypex>
description: WeTypeX native Linux input method for Fcitx5
vendor: WeTypeX contributors
homepage: https://github.com/panxuc/fcitx5-wetypex
license: MIT AND curl AND ISC AND BSD-2-Clause AND Apache-2.0
scripts:
  postinstall: "@WETYPEX_PROJECT_ROOT@/packaging/post-install.sh"
contents:
  - src: "@WETYPEX_STAGE@/"
    dst: /
    type: tree
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libstdc++6 (>= 11)
      - libc++1
      - llvm-libunwind1 | libunwind-x.y
      - libssl3 | libssl3t64
      - ca-certificates
      - libjson-c5
      - fcitx5 (>= 5.0.14)
      - libfcitx5-qt1 (>= 5.0.10)
      - libimecore0 (>= 1.0.11)
      - libimepinyin0 (>= 1.0.11)
      - libqt5widgets5
      - libqt5network5
      - libqt5dbus5
      - libqt5svg5
      - libqt5webenginewidgets5
      - bubblewrap
      - util-linux
      - python3
      - pipewire-bin | pipewire
      - ffmpeg
      - wl-clipboard
      - libnotify-bin
      - pkexec | policykit-1
  rpm:
    depends:
      - glibc
      - libcxx
      - openssl-libs
      - ca-certificates
      - json-c
      - fcitx5
      - fcitx5-qt-libfcitx5qt6widgets
      - libime
      - qt6-qtbase
      - qt6-qtsvg
      - qt6-qtwebengine
      - bubblewrap
      - util-linux
      - python3
      - pipewire-utils
      - /usr/bin/ffmpeg
      - wl-clipboard
      - libnotify
      - polkit
