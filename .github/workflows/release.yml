name: 发布
run-name: WeTypeX release ${{ inputs.tag || github.ref_name }}${{ inputs.only_aur && ' (AUR only)' || '' }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to rebuild
        required: true
        type: string
      only_aur:
        description: Skip package builds and only publish AUR metadata
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  arm64:
    if: ${{ !inputs.only_aur }}
    uses: ./.github/workflows/packages-arm64.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  release:
    needs: arm64
    if: ${{ !inputs.only_aur }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 校验标签与源码版本
        shell: bash
        run: |
          version=$(sed -n 's/^project([^ ]* VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          pkgrel=$(sed -n 's/^pkgrel=//p' packaging/PKGBUILD.in)
          test "v${version}-${pkgrel}" = "${RELEASE_TAG}"

      - name: 安装发布工具
        run: sudo apt-get update && sudo apt-get install -y zstd

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: 安装 nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          sudo install "$(go env GOPATH)/bin/nfpm" /usr/local/bin/nfpm

      - name: 构建 Debian 与 Fedora 软件包
        env:
          WETYPEX_BUILD_JOBS: "2"
        run: packaging/build-native-packages.sh

      - name: 生成源码包与 Arch 构建文件
        run: python3 tools/package_release.py

      - name: 构建 Arch Linux 软件包
        shell: bash
        run: |
          docker run --rm \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
            archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm git cmake clang boost fcitx5 fcitx5-qt libime libc++ \
                json-c curl bubblewrap util-linux python python-fonttools python-pillow fontconfig qt6-base qt6-svg \
                qt6-webengine layer-shell-qt pipewire ffmpeg wl-clipboard libnotify polkit
              useradd -m builder
              cp -a /src/dist/arch /tmp/arch
              chown -R builder:builder /tmp/arch
              su builder -c "cd /tmp/arch && makepkg -C -f --noconfirm"
              cp /tmp/arch/fcitx5-wetypex-[0-9]*-x86_64.pkg.tar.zst /out/arch/
            '

      - name: 生成便携归档与校验和
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          test "$(dpkg-deb -f dist/debian/*.deb Version)" = "$version"
          test "$(dpkg-deb -f dist/ubuntu20/*.deb Version)" = "$version"
          rpm_version=$(docker run --rm -v "$PWD/dist:/out:ro" wetypex-build-fedora \
            bash -euc 'rpm -qp --queryformat "%{VERSION}-%{RELEASE}" /out/fedora/*.rpm')
          test "$rpm_version" = "$version"
          arch_version=$(tar --zstd -xOf dist/arch/*.pkg.tar.zst .PKGINFO | \
            sed -n 's/^pkgver = //p')
          test "$arch_version" = "$version"
          tar --zstd -C dist/debian-root -cf \
            "dist/fcitx5-wetypex-${version}-linux-x86_64.tar.zst" .

      - name: 汇总 ARM64 软件包
        uses: actions/download-artifact@v7
        with:
          name: fcitx5-wetypex-arm64-packages
          path: dist

      - name: 为全部架构生成校验和
        shell: bash
        run: python3 tools/update_upstream.py --verify-release-dir dist --tag "$RELEASE_TAG"

      - name: 保存构建产物
        uses: actions/upload-artifact@v7
        with:
          name: fcitx5-wetypex-${{ inputs.tag || github.ref_name }}
          path: |
            dist/arch/fcitx5-wetypex-*.pkg.tar.zst
            dist/arch/fcitx5-wetypex-*.tar.gz
            dist/debian/fcitx5-wetypex_*.deb
            dist/ubuntu20/fcitx5-wetypex-legacy_*.deb
            dist/fedora/fcitx5-wetypex-*.rpm
            dist/fcitx5-wetypex-*-linux-*.tar.zst
            dist/SHA256SUMS

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=(
            dist/arch/fcitx5-wetypex-*.pkg.tar.zst
            dist/arch/fcitx5-wetypex-*.tar.gz
            dist/debian/fcitx5-wetypex_*.deb
            dist/ubuntu20/fcitx5-wetypex-legacy_*.deb
            dist/fedora/fcitx5-wetypex-*.rpm
            dist/fcitx5-wetypex-*-linux-*.tar.zst
            dist/SHA256SUMS
          )
          if python3 tools/update_upstream.py --release-complete "$RELEASE_TAG"; then
            echo 'Published artifacts are already complete; preserving their checksums.'
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft=true --repo "$GITHUB_REPOSITORY"
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "WeTypeX ${RELEASE_TAG#v}" --generate-notes --draft --verify-tag
          fi
          latest=$(python3 tools/update_upstream.py --release-policy "$RELEASE_TAG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["make_latest"])')
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -F prerelease=false -f make_latest="$latest" >/dev/null
          python3 tools/update_upstream.py --release-complete "$RELEASE_TAG"

  aur:
    needs: release
    if: ${{ always() && (inputs.only_aur || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: 安装 AUR 发布工具
        run: pacman -Syu --noconfirm curl git openssh
      - name: 发布 AUR 元数据
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          version=$(sed -n 's/^project([^ ]* VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          revision=$(sed -n 's/^pkgrel=//p' packaging/PKGBUILD.in)
          test "v$version-$revision" = "$RELEASE_TAG"
          test -n "$AUR_SSH_PRIVATE_KEY"
          useradd --create-home builder
          install -d -o builder -g builder -m0700 /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          ssh-keyscan -H aur.archlinux.org > /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/aur /home/builder/.ssh/known_hosts
          chmod 0600 /home/builder/.ssh/aur /home/builder/.ssh/known_hosts
          git_ssh='ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/builder/.ssh/known_hosts'
          runuser -u builder -- env \
            HOME=/home/builder \
            GIT_SSH_COMMAND="$git_ssh" \
            RELEASE_TAG="$RELEASE_TAG" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            bash -lc '
              git clone ssh://aur@aur.archlinux.org/fcitx5-wetypex.git "$HOME/aur"
              version=$(sed -n "s/^project([^ ]* VERSION \([^ ]*\).*/\1/p" "$1/CMakeLists.txt")
              pkgrel=$(sed -n "s/^pkgrel=//p" "$1/packaging/PKGBUILD.in")
              if [[ -f "$HOME/aur/PKGBUILD" ]]; then
                published=$(sed -n "s/^pkgver=//p" "$HOME/aur/PKGBUILD")
                revision=$(sed -n "s/^pkgrel=//p" "$HOME/aur/PKGBUILD")
                if [[ $(vercmp "$version-$pkgrel" "$published-$revision") -lt 0 ]]; then
                  echo "AUR already contains a newer version; keeping it."
                  exit 0
                fi
              fi
              cp "$1/packaging/aur/PKGBUILD" \
                 "$1/packaging/aur/fcitx5-wetypex.install" "$HOME/aur/"
              cd "$HOME/aur"
              version=$(sed -n "s/^project([^ ]* VERSION \([^ ]*\).*/\1/p" "$1/CMakeLists.txt")
              pkgrel=$(sed -n "s/^pkgrel=//p" "$1/packaging/PKGBUILD.in")
              sed -i "s/^pkgver=.*/pkgver=$version/" PKGBUILD
              sed -i "s/^pkgrel=.*/pkgrel=$pkgrel/" PKGBUILD
              source_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/fcitx5-wetypex-${version}.tar.gz"
              digest="$(curl -fsSL "$source_url" | sha256sum | cut -d" " -f1)"
              sed -i "s/^sha256sums=(\"SKIP\" /sha256sums=(\"$digest\" /" PKGBUILD
              makepkg --printsrcinfo > .SRCINFO
              git config user.name wetypex-release-bot
              git config user.email actions@users.noreply.github.com
              git add PKGBUILD fcitx5-wetypex.install .SRCINFO
              if git diff --cached --quiet; then
                echo "AUR metadata is already current"
                exit 0
              fi
              git commit -m "fcitx5-wetypex $version-$pkgrel"
              git push
            ' _ "$GITHUB_WORKSPACE"
